# llama_proxy 配置文件

server:
  listen_addr: ":9091"
  data_dir: "./data"
  # 允许访问 /_proxy/ui 面板的 Host 白名单（忽略端口与大小写）。
  # 留空则不限制。配置后，Host 不在列表内的请求访问面板返回 403。
  ui_allowed_hosts:
    - "llm.youcd.online"

database:
  type: "sqlite"  # sqlite 或 postgresql
  sqlite:
    path: "proxy.db"
  postgresql:
    dsn: "postgres://user:password@localhost:5432/proxy?sslmode=disable"
    max_open_conns: 25
    max_idle_conns: 5
    conn_max_lifetime_seconds: 300

backends:
  allow_dynamic: true
  strategy: "wrr"  # wrr, swrr, wr, rr, random
  list:
    - name: "gpu-server-1"
      url: "http://gpu-server-1:8080"
      weight: 50
      enabled: true
      model: "qwen"          # 该后端实际部署的模型 ID，转发时自动重写请求体的 model 字段
      api_key: "secret-1"    # 该后端的 API Key，转发时自动注入 Authorization: Bearer <key>
      # tags: ["fast"]       # 可选：加入的路由标签池，routing 规则按 pool 标签选择后端
      # tool_call: true      # 可选：该后端支持工具调用（等价于 tags 含 "tool_call"）
    - name: "gpu-server-2"
      url: "http://gpu-server-2:8080"
      weight: 30
      enabled: true
      model: "deepseek"      # 该后端实际部署的模型 ID
      api_key: "secret-2"    # 该后端的 API Key
    - name: "cpu-server"
      url: "http://cpu-server:8080"
      weight: 20
      enabled: true

# 路由规则（可选）：按客户端特征把请求固定到指定标签池，规则按顺序评估、首条命中生效。
# 命中规则的请求：只从 pool 标签对应的后端子池（tags 或 tool_call 命中该标签）中选择，
# 动态覆盖（X-Backend-URL / ?backend=）不生效，请求失败时自动转移到子池内下一个后端。
# 未配置时回退到内置规则：User-Agent 含 "GoClaw" → tool_call 池（保持既有行为）。
#routing:
#  rules:
#    - name: "goclaw"                      # 规则名，仅用于日志与报错
#      match:
#        user_agent_contains: "GoClaw"     # User-Agent 包含该子串（忽略大小写）
#      pool: "tool_call"                   # 只路由到携带 tool_call 标签的后端
#    - name: "agent-x"                     # 多条件 AND：UA 命中 且 任一 header 完全匹配
#      match:
#        user_agent_contains: "AgentX"
#        header:
#          X-Agent-Env: "prod"
#      pool: "fast"

proxy:
  retention_days: 14
  max_request_bytes: 33554432  # 32MB
  max_capture_bytes: 33554432  # 32MB
  request_timeout_seconds: 600
  poll_backend_metrics: true
  poll_interval_seconds: 10
  # 白名单：仅命中这些路径的请求被转发记录，其余一律 404（精确或前缀匹配）。
  # 默认白名单为 OpenAI 兼容接口，未配置时生效。
  record_paths:
    - "/v1/chat/completions"
    - "/v1/completions"
    - "/v1/embeddings"

