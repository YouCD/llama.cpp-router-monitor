# llama_proxy 配置文件

server:
  listen_addr: ":9091"
  data_dir: "./data"
  # 允许访问 /_proxy/ui 面板的 Host 白名单（忽略端口与大小写）。
  # 留空则不限制。配置后，Host 不在列表内的请求访问面板返回 403。
  ui_allowed_hosts:
    - "llm.youcd.online"

database:
  type: "sqlite"  # sqlite 或 postgresql
  sqlite:
    path: "proxy.db"
  postgresql:
    dsn: "postgres://user:password@localhost:5432/proxy?sslmode=disable"
    max_open_conns: 25
    max_idle_conns: 5
    conn_max_lifetime_seconds: 300

backends:
  allow_dynamic: true
  strategy: "wrr"  # wrr, swrr, wr, rr, random
  list:
    - name: "gpu-server-1"
      url: "http://gpu-server-1:8080"
      weight: 50
      enabled: true
      model: "qwen"          # 该后端实际部署的模型 ID，转发时自动重写请求体的 model 字段
      api_key: "secret-1"    # 该后端的 API Key，转发时自动注入 Authorization: Bearer <key>
    - name: "gpu-server-2"
      url: "http://gpu-server-2:8080"
      weight: 30
      enabled: true
      model: "deepseek"      # 该后端实际部署的模型 ID
      api_key: "secret-2"    # 该后端的 API Key
    - name: "cpu-server"
      url: "http://cpu-server:8080"
      weight: 20
      enabled: true

proxy:
  retention_days: 14
  max_request_bytes: 33554432  # 32MB
  max_capture_bytes: 33554432  # 32MB
  request_timeout_seconds: 600
  poll_backend_metrics: true
  poll_interval_seconds: 10
  # 白名单：仅命中这些路径的请求被转发记录，其余一律 404（精确或前缀匹配）。
  # 默认白名单为 OpenAI 兼容接口，未配置时生效。
  record_paths:
    - "/v1/chat/completions"
    - "/v1/completions"
    - "/v1/embeddings"

