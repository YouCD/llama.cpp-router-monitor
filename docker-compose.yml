services:
  llama-proxy:
    build:
      context: .
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,https://proxy.golang.org,direct}
    container_name: llama-proxy
    ports:
      - "9091:9091"
    volumes:
      - ./data:/app/data
      # 挂载 YAML 配置文件（配置监听地址、后端负载均衡等）
      - ./config.yaml:/app/config.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

